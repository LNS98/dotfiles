# herdr config — parallel to ~/.tmux.conf
# Path: ~/.config/herdr/config.toml (symlinked from dotfiles)
# Reload after edits: `herdr server reload-config` (or prefix+shift+R below)
# Validate: `herdr config check`
# Print full default config for reference: `herdr --default-config`
# Upgrade: detach (prefix+q), then `herdr update` — it refuses to run inside a session.
# Options below marked 0.8+ need herdr >= 0.8.2.

onboarding = false

# ── Keybindings ───────────────────────────────────────────────
# Prefix is ctrl+a (home row), like tmux. "prefix+x" = ctrl+a then x.
[keys]
prefix = "ctrl+a"

# tabs ≈ tmux windows
new_tab        = "prefix+c"          # tmux: c new-window
next_tab       = ["prefix+t", "prefix+n"]        # tmux t + herdr default n
previous_tab   = ["prefix+shift+t", "prefix+p"]  # tmux T + herdr default p
rename_tab     = "prefix+comma"      # moved off shift+t (default) to free T
close_tab      = "prefix+shift+x"
switch_tab     = "prefix+1..9"       # tmux base-index 1: panes/tabs are 1-based

# splits — matches your vim-style bindings
split_vertical   = "prefix+v"        # tmux: v split-window -h (left/right)
split_horizontal = "prefix+s"        # tmux: s split-window -v (top/bottom)

# pane focus (prefix + h/j/k/l, vi directions)
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# pane swap (bonus — no tmux equivalent you had, but vi-consistent)
swap_pane_left   = "prefix+shift+h"
swap_pane_down   = "prefix+shift+j"
swap_pane_up     = "prefix+shift+k"
swap_pane_right  = "prefix+shift+l"

close_pane = "prefix+x"
zoom       = "prefix+z"
resize_mode = "prefix+r"

# one-keystroke resize (0.8+) — tmux default is prefix+ctrl+arrows; vi letters here
resize_pane_left  = "prefix+ctrl+h"
resize_pane_down  = "prefix+ctrl+j"
resize_pane_up    = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

# reorder tabs in place (0.8+) — tmux idiom: swap-window -t -1 / +1 on < and >
move_tab_previous = "prefix+<"
move_tab_next     = "prefix+>"

# navigate-mode quick keys (plain h/j/k/l while the navigate overlay is open)
navigate_pane_left  = "h"
navigate_pane_down  = "j"
navigate_pane_up    = "k"
navigate_pane_right = "l"

# copy mode (tmux: [ )
copy_mode = "prefix+["

# herdr-specific but useful
detach          = "prefix+q"         # NOTE: tmux used q for display-panes; herdr reserves q for detach
toggle_sidebar  = "prefix+b"
workspace_picker = "prefix+w"
new_workspace   = "prefix+shift+n"

reload_config   = "prefix+shift+r"   # tmux: R source-file (native herdr action)

last_pane       = "prefix+a"         # tmux: a last-window (jump to previous)

# ── Theme (replaces tmux status-bar colors) ───────────────────
# herdr has no status line; it themes the whole UI + sidebar dashboard.
# tokyo-night ≈ your magenta/cyan/blue palette on a dark background.
[theme]
name = "tokyo-night"

[theme.custom]
accent = "#bb9af7"   # mauve/magenta — your active-window magenta
green  = "#9ece6a"   # your green hostname
blue   = "#7aa2f7"
yellow = "#e0af68"   # your active pane-border yellow
red    = "#f7768e"

# ── UI / sidebar ──────────────────────────────────────────────
[ui]
mouse_capture = true         # tmux: set -g mouse on
sidebar_width = 32
confirm_close = true
prompt_new_tab_name = false  # new tab (prefix+c) auto-names, no prompt
pane_borders  = true
accent = "cyan"              # tmux: pane-border-style fg=cyan
agent_panel_sort = "priority"

# tmux-style splitters (0.8+): internal dividers only, no outer frame, no gaps, no scrollbars
pane_outer_borders = false
pane_gaps          = false
pane_scrollbars    = false

# Tab bar as tmux status bar (0.8+): bottom, with status-right clock/date + hostname
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },                                   # tmux: status-left #H
  { type = "datetime", format = "%a %l:%M:%S %p  %Y-%m-%d" }, # tmux: status-right
]
tab_bar_right_separator = "  "

# Sidebar rows (0.8+). 0.8 dropped the blank line between entries; row_gap = 1 restores it.
# Agents read as "tab · workspace" (what you're doing, then where) instead of the default reverse.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "tab", fg = "#ffffff", bold = true, dim = false }, { token = "workspace", fg = "#565f89", bold = false, dim = true }],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 1

# Popup notification when an agent finishes / needs input (herdr superpower)
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = true

# ── Terminal defaults ─────────────────────────────────────────
[terminal]
shell_mode = "auto"          # login shell on macOS so PATH/brew init runs
new_cwd = "follow"
